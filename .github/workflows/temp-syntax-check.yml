name: Temporary Apps Script syntax check
on:
  push:
    branches: [main]
    paths:
      - 'apps-script/Code.gs'
      - '.github/workflows/temp-syntax-check.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse Apps Script JavaScript syntax
        run: |
          cp apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
