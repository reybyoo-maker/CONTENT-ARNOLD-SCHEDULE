name: Temporary Code Syntax Check

on:
  push:
    paths:
      - "apps-script/Code.gs"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Apps Script JavaScript syntax
        run: cp apps-script/Code.gs /tmp/Code.js && node --check /tmp/Code.js
