name: Temporary draft validation test
on:
  push:
    branches: [main]
    paths:
      - 'apps-script/Code.gs'
      - '.github/workflows/temp-draft-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax and normalize invalid Gemini drafts
        shell: bash
        run: |
          cp apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          cat > /tmp/test-drafts.js <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const src = fs.readFileSync('/tmp/Code.js', 'utf8');
          const sandbox = {
            Logger: { log: function () {} },
            Utilities: { formatDate: function (date) { return date.toISOString().slice(0, 10); } }
          };
          vm.createContext(sandbox);
          const testLines = [
            "const feedSlot = {date:'2026-10-27', day:'Selasa', time:'12:15', format:'Feed (single image)', dailyCount:2, postNumber:1};",
            "const carouselSlot = {date:'2026-10-27', day:'Selasa', time:'18:45', format:'Carousel', dailyCount:2, postNumber:2};",
            "const research = [{title:'Leadership research on feedback',publisher:'Gallup',publishedDate:'2026-10-01',url:'https://www.gallup.com/workplace/',summary:'Research on manager communication.'}];",
            "const makePost = (slot, slideCount, exampleId, hasExtraSlides) => { const hook='Pemimpin perlu mendengar tim'; const slides=Array.from({length:slideCount},(_,i)=>({slide_number:i+1,role:i===0?'cover':(i===slideCount-1?'cta':'analisis'),slide_text:i===0?hook:(i===slideCount-1?'Coba langkah ini bersama tim':'Ketika tim terlambat, klarifikasi hambatan sebelum menyalahkan orang.'),visual_direction:'Visual sederhana untuk slide '+(i+1)})); return {topic:'Leadership dan komunikasi tim',pillar:'Leadership in Practice',hook:hook,production_plan:'Contoh situasi rapat tim dan langkah pemimpin untuk mendengar lebih dulu.',carousel_slides:hasExtraSlides?slides:slides,caption:'Ketika target tertunda, pemimpin perlu memahami hambatan, memperjelas prioritas, dan menyepakati tindak lanjut dengan tim.',cta:'Ceritakan praktik yang membantu tim lo.',hashtags:['Leadership','Teamwork'],reference_ids:['R1'],example_id:exampleId,example_format_match:'wrong label',example_adaptation:'Adapt the public example.',original_angle:'Situasi kerja praktis.',case_type:'illustrative_scenario',case_or_field_scenario:'Simulasi: anggota tim terlambat menyelesaikan pekerjaan.',case_source_id:'',fact_check_notes:'Contoh simulasi, bukan kasus klien.'}; };",
            "let calls = 0;",
            "generatePostsBatch_ = function(slots) { calls++; if (slots.length>1 && calls===1) return [makePost(slots[0],1,'CE05',true)]; if (slots.length>1 && calls===2) return slots.map(slot=>makePost(slot,slot.format==='Carousel'?5:1,slot.format==='Carousel'?'CE07':'CE05',true)); if (slots[0].format==='Carousel' && calls===4) return [makePost(slots[0],5,'CE07',true)]; return slots.map(slot=>makePost(slot,slot.format==='Carousel'?7:2,slot.format==='Carousel'?'CE07':'CE05',true)); };",
            "const fixed = generatePostsBatchWithRetry_([feedSlot,carouselSlot],research,2);",
            "if (fixed.length!==2) throw new Error('Expected two posts after recovery.');",
            "if (fixed[0].carousel_slides.length!==0) throw new Error('Feed slides were not reset to an empty array.');",
            "if (!exampleSupportsFormat_(EXAMPLES.find(e=>e.id===fixed[0].example_id),feedSlot.format)) throw new Error('Feed example was not format-corrected.');",
            "if (fixed[1].carousel_slides.length!==7) throw new Error('Carousel was not regenerated to seven slides.');",
            "if (!exampleSupportsFormat_(EXAMPLES.find(e=>e.id===fixed[1].example_id),carouselSlot.format)) throw new Error('Carousel example was not format-corrected.');",
            "const sourceMap={R1:research[0]}, exampleMap={}; EXAMPLES.forEach(e=>exampleMap[e.id]=e);",
            "validateDraftPosts_(fixed,[feedSlot,carouselSlot],sourceMap,exampleMap);",
            "console.log(JSON.stringify({status:'PASS',posts:fixed.length,retriesAndFallbackCalls:calls,feedExample:fixed[0].example_id,carouselExample:fixed[1].example_id,carouselSlides:fixed[1].carousel_slides.length}));"
          ];
          vm.runInContext(src + '\n' + testLines.join('\n'), sandbox);
          JS
          node /tmp/test-drafts.js
