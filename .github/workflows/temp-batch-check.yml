name: Temporary Gemini batch validation
on:
  push:
    branches: [main]
    paths:
      - 'apps-script/Code.gs'
      - '.github/workflows/temp-batch-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax and batch fallback behavior
        shell: bash
        run: |
          cp apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          cat > /tmp/test-batches.js <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const src = fs.readFileSync('/tmp/Code.js', 'utf8');
          const sandbox = {
            Logger: { log: function () {} },
            Utilities: { formatDate: function (date) { return date.toISOString().slice(0, 10); } }
          };
          vm.createContext(sandbox);
          const test = String.raw\`
            const week = buildSchedule_('2026-10-21');
            const reels = week.filter(slot => slot.format === 'Reels').length;
            if (reels !== 1) throw new Error('Expected one Reels slot, got ' + reels);
            const counts = {};
            week.forEach(slot => counts[slot.format] = (counts[slot.format] || 0) + 1);
            ['Reels', 'Carousel', 'Feed (single image)'].forEach(format => {
              if (!week.some(slot => slot.format === format)) {
                // Not every calendar needs every format every week; test format helpers separately below.
                return;
              }
            });
            if (!exampleSupportsFormat_(EXAMPLES.find(e => e.formatMatch === 'Reels / Video'), 'Reels')) {
              throw new Error('Video reference format helper failed');
            }
            if (!exampleSupportsFormat_(EXAMPLES.find(e => e.formatMatch === 'Carousel'), 'Carousel')) {
              throw new Error('Carousel reference format helper failed');
            }
            if (!exampleSupportsFormat_(EXAMPLES.find(e => e.formatMatch === 'Feed (single image)'), 'Feed (single image)')) {
              throw new Error('Feed reference format helper failed');
            }
            const baseSlots = week.slice(0, 12);
            let attempts = 0;
            generatePostsBatch_ = function(batch) {
              attempts++;
              if (batch.length > 1 && attempts === 1) return batch.slice(0, batch.length - 1).map(slot => ({date:slot.date}));
              return batch.map(slot => ({date:slot.date, format:slot.format}));
            };
            const generated = generatePosts_(baseSlots, []);
            if (generated.length !== baseSlots.length) throw new Error('Expected '+baseSlots.length+' posts, got '+generated.length);
            if (attempts < 5) throw new Error('Expected retry and chunked generation attempts, got '+attempts);
            console.log(JSON.stringify({status:'PASS', weekSlotCount:week.length, weeklyReels:reels, testedSlots:generated.length, batchCalls:attempts, scheduleFormats:counts}));
          \`;
          vm.runInContext(src + '\\n' + test, sandbox);
          JS
          node /tmp/test-batches.js
