name: Validate Content Planner

on:
  push:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python without running APIs
        run: python -m py_compile scripts/generate_calendar.py
